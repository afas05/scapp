name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GSTREAMER_VERSION: '1.24.13'
  GSTREAMER_ROOT: 'C:\gstreamer\1.0\msvc_x86_64'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pkg-config
        shell: pwsh
        run: choco install -y --no-progress pkgconfiglite

      - name: Download GStreamer MSIs
        shell: pwsh
        run: |
          $ver  = $env:GSTREAMER_VERSION
          $base = "https://streamsnipe.live/build-assets"
          Write-Host "Downloading runtime MSI..."
          curl.exe -L --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\gstreamer-1.0-msvc-x86_64-$ver.msi" "$base/gstreamer-1.0-msvc-x86_64-$ver.msi"
          Write-Host "Downloading devel MSI..."
          curl.exe -L --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\gstreamer-1.0-devel-msvc-x86_64-$ver.msi" "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi"

      - name: Install GStreamer (runtime + devel) MSIs
        shell: pwsh
        run: |
          function Install-Msi($path, $logName) {
            $log = "$env:RUNNER_TEMP\$logName.log"
            Write-Host "==> Installing $path"
            $proc = Start-Process msiexec.exe `
              -ArgumentList "/i", "`"$path`"", "/qn", "/norestart", "/l*v", "`"$log`"", "ADDLOCAL=ALL", "INSTALLDIR=C:\gstreamer" `
              -Wait -PassThru
            Write-Host "msiexec exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              Write-Host "----- last 80 lines of $log -----"
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw "MSI install failed: $path (exit $($proc.ExitCode))"
            }
          }

          $runtime = "$env:RUNNER_TEMP\gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi"
          $devel   = "$env:RUNNER_TEMP\gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi"
          Write-Host "Runtime MSI size: $((Get-Item $runtime).Length) bytes"
          Write-Host "Devel   MSI size: $((Get-Item $devel).Length) bytes"

          Install-Msi $runtime 'gst-runtime-install'
          Install-Msi $devel   'gst-devel-install'

          Write-Host "==> Listing C:\gstreamer (post-install)"
          if (Test-Path C:\gstreamer) {
            Get-ChildItem -Path C:\gstreamer -Recurse -Depth 3 -Directory | Select-Object -ExpandProperty FullName
          }

          if (-not (Test-Path "$env:GSTREAMER_ROOT\bin\gstreamer-1.0-0.dll")) {
            Write-Host "==> Expected DLL missing. Searching drives + user profile..."
            $hits = Get-ChildItem -Path C:\, D:\, $env:USERPROFILE -Filter "gstreamer-1.0-0.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 -ExpandProperty FullName
            if ($hits) {
              Write-Host "Found gstreamer-1.0-0.dll at:"
              $hits | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "Nothing found anywhere. Grepping MSI logs for INSTALLDIR/TARGETDIR..."
              foreach ($l in @("$env:RUNNER_TEMP\gst-runtime-install.log", "$env:RUNNER_TEMP\gst-devel-install.log")) {
                if (Test-Path $l) {
                  Write-Host "----- $l (TARGETDIR/INSTALLDIR/Property lines) -----"
                  Select-String -Path $l -Pattern 'INSTALLDIR|TARGETDIR|Installed external file' | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
                }
              }
            }
            Write-Error "GStreamer install missing: $env:GSTREAMER_ROOT not populated"
            exit 1
          }

      - name: Configure GStreamer environment
        shell: pwsh
        run: |
          "$env:GSTREAMER_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GSTREAMER_ROOT\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage GStreamer DLLs for build.rs and bundler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\gstreamer\bin | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri\gstreamer\plugins | Out-Null
          Copy-Item -Path "$env:GSTREAMER_ROOT\bin\*.dll" -Destination src-tauri\gstreamer\bin\ -Force
          Copy-Item -Path "$env:GSTREAMER_ROOT\lib\gstreamer-1.0\*.dll" -Destination src-tauri\gstreamer\plugins\ -Force
          Write-Host "Runtime DLLs: $((Get-ChildItem src-tauri\gstreamer\bin\*.dll).Count)"
          Write-Host "Plugin DLLs:  $((Get-ChildItem src-tauri\gstreamer\plugins\*.dll).Count)"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'scapp ${{ github.ref_name }}'
          releaseBody: 'See assets to download and install.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'scapp ${{ github.ref_name }}'
          releaseBody: 'See assets to download and install.'
          releaseDraft: true
          prerelease: false

  publish:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
